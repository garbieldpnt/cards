<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Cartes Interactif</title>
    <!-- Lien vers le fichier de configuration Android -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b9e4a">

    <!-- Compatibilité plein écran pour les iPhone (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gages">
    
    <!-- Icône pour l'écran d'accueil iPhone -->
    <link rel="apple-touch-icon" href="images/icone.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- VUE 1 : MENU PRINCIPAL (4 cartes) -->
        <div id="view-menu" class="view">
            <div class="menu-grid" id="menu-grid">
                <!-- Les 4 cartes "As" seront générées ici par le JS -->
            </div>
        </div>

        <!-- VUE 2 : PLATEAU DE JEU (12 cartes) -->
        <div id="view-suit" class="view hidden">
            <div class="header">
                <button id="btn-back" class="back-button">◀ Retour</button>
                <h2 id="suit-title">Cartes</h2>
            </div>
            <div class="game-board" id="game-board">
                <!-- Les 12 cartes seront générées ici par le JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
